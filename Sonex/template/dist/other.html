		<script>
			document.addEventListener('DOMContentLoaded', function () {
			  const modal = document.getElementById('video-modal');
			  const iframe = document.getElementById('yt-player');
			
			  function openVideoModal(videoId) {
			    if (!modal || !iframe) return;
			    iframe.style.visibility = 'hidden';
			    iframe.src = videoId;
			    iframe.onload = () => {
			      setTimeout(() => { iframe.style.visibility = 'visible' }, 100);
			    };
			    modal.classList.add('active');
			  }
			
			  function closeVideoModal() {
			    if (!modal || !iframe) return;
			    iframe.src = '';
			    modal.classList.remove('active');
			  }
			
			  // Zamknięcie modala po kliknięciu poza .modal-content
			  if (modal) {
			    modal.addEventListener('click', (e) => {
			      if (!e.target.closest('.modal-content')) {
			        closeVideoModal();
			      }
			    });
			  }
			
			  // Kliknięcie na kontener .videos-item (który ma teraz data-video-id)
			  const videoItems = document.querySelectorAll('.videos-item');
			  videoItems.forEach(item => {
			    item.addEventListener('click', () => {
			      const videoId = item.dataset.videoId;
			      if (videoId) {
			        openVideoModal(videoId);
			      } else {
			        console.warn('Brak data-video-id w .videos-item');
			      }
			    });
			  });
			
			  // Lazy loading video z obsługą błędów play/pause
			  const videos = document.querySelectorAll('.videos-item video');
			  const observer = new IntersectionObserver((entries) => {
			    entries.forEach(entry => {
			      if (entry.isIntersecting) {
			        const playPromise = entry.target.play();
			        if (playPromise !== undefined) {
			          playPromise.catch(error => {
			            if (error.name !== 'AbortError') {
			              console.error('Video play error:', error);
			            }
			          });
			        }
			      } else {
			        entry.target.pause();
			      }
			    });
			  });
			  videos.forEach(v => observer.observe(v));
			
			  // Obsługa swipe'ów w #project-carousel na mobile
			  const carousel = document.querySelector('#project-carousel');
			  let startX = 0;
			
			  if (carousel) {
			    carousel.addEventListener('touchstart', (e) => {
			      startX = e.touches[0].clientX;
			    });
			
			    carousel.addEventListener('touchend', (e) => {
			      const endX = e.changedTouches[0].clientX;
			      const diffX = startX - endX;
			
			      if (Math.abs(diffX) > 50) {
			        const direction = diffX > 0 ? 'next' : 'prev';
			        $(carousel).carousel(direction); // jQuery Bootstrap API
			      }
			    });
			  }
			});
		</script>
